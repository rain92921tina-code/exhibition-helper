        function escapeHTML(value) {

            if (value === undefined || value === null) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        // =========================================================

            if (!db) {
                render();

                    await getDocs(collection(db, "exhibitions"));

                exhibitions = [];

                querySnapshot.forEach((docSnap) => {

                    exhibitions.push({

                        id: docSnap.id,

                        ...docSnap.data()

                    });

                });

                console.log("Firebase 資料載入成功:", exhibitions);

            } catch (error) {

                console.error("Firebase 讀取失敗:", error);

                    "以及 Firestore Rules 是否允許讀取。"
                );
            }

            render();
        }

                                               flex

                                    >

                                                class="text-lg

                                            </h2>

                                                家

            }


            // =====================================================

            else if (currentView === "detail") {

                    exhibitions.find(e => e.id === currentExId);

                if (!ex) {

                    currentView = "home";

                    render();

                    return;

                container.innerHTML = `

                    <div>

                        <button

                                   text-sm

                                    廠商與商品管理
                                </div>

                                <p class="text-xs text-gray-500">
                                    新增廠商、Logo、商品、價格與網址
                                </p>

                            <button
                                onclick="window.switchView('map')"
                                class="bg-white
                                       p-6
                                       rounded-xl
                                       shadow-sm
                                       border

                            >

                                <p class="text-xs text-gray-500">

                                </p>

                `;
            }


            // =====================================================
            // VENDORS

            else if (currentView === "vendors") {

                const ex =
                    exhibitions.find(e => e.id === currentExId);

                if (!ex) {

                    currentView = "home";

                    render();

                    return;
                }


                const vendors = ex.vendors || [];


                container.innerHTML = `

                    <div>

                                   mb-4

                        <h1

                        <div

                                class="w-full
                                       border
                                       p-2

                                       mb-2
                                       text-sm"
                            >


                            <input
                                id="v-url"
                                type="url"
                                placeholder="官方網站 / 賣場網址，例如：https://..."
                                class="w-full
                                       border
                                       p-2
                                       rounded
                                       mb-2
                                       text-sm"
                            >


                            <input
                                id="p-name"
                                type="text"
                                placeholder="推薦商品名稱"
                                class="w-full
                                       border
                                       p-2
                                       rounded
                                       mb-2
                                       text-sm"
                            >


                            <input
                                id="p-price"
                                type="text"
                                placeholder="價格"
                                class="w-full
                                       border
                                       p-2
                                       rounded
                                       mb-4
                                       text-sm"
                            >


                            <button

                                       w-full

                                新增廠商

                        </div>


                        <!-- 廠商清單 -->

                        <div class="space-y-3">

                                    尚未新增廠商
                                </p>

                                :

                                vendors.map((v, idx) => `

                                               p-4

                                                            : ""

                                                ${

                `;
            }


            // =====================================================
            // MAP

            else if (currentView === "map") {

                container.innerHTML = `

                    <div>

                        <button
                            onclick="window.switchView('detail')"
                            class="text-blue-600
                                   text-sm
                                   mb-4
                                   inline-block"
                        >
                            ← 回到功能選單
                        </button>


                        <h1
                            class="text-2xl
                                   font-bold
                                   mb-2"
                        >
                            互動地圖
                        </h1>


                        <p
                            class="text-xs
                                   text-gray-500
                                   mb-4"
                        >
                            點擊下方攤位代碼，即可查看商家資訊。
                        </p>


                        <div
                            class="grid
                                   grid-cols-2
                                   sm:grid-cols-3
                                   gap-3
                                   mb-6"
                        >

                            ${
                                [
                                    "A01",
                                    "A02",
                                    "A03",

                                    "B02",
                                    "B03"
                                ]

                                .map(code => `

                                    <div
                                        onclick="window.openVendorByCode('${code}')"
                                        class="bg-white
                                               border-2
                                               border-dashed
                                               border-gray-300
                                               h-24
                                               rounded-xl
                                               flex
                                               flex-col
                                               items-center
                                               justify-center
                                               cursor-pointer

                                               hover:bg-blue-50
                                               transition"
                                    >

                                        <span
                                            class="font-bold

                                        >
                                            ${code}

                                `).join("")
                            }

                        </div>

                        <div

                        >

                                class="font-bold
                                       text-blue-600
                                       mb-2"

                                id="modal-content-body"
                                class="text-sm"
                            >
                            </div>

                        </div>

                    </div>
                `;
            }
        }


        // =========================================================
        // 新增展會
        // =========================================================

        window.showAddModal = async function() {

            const name =
                prompt("請輸入展會名稱，例如：TTF 2026");

            if (!name || !name.trim()) {
                return;
            }


            if (!db) {

                alert("Firebase 尚未成功連線。");

                return;
            }


            try {

                await addDoc(
                    collection(db, "exhibitions"),
                    {
                        name: name.trim(),
                        vendors: [],
                        createdAt: new Date().toISOString()
                    }
                );


                alert("展會新增成功！");

                await loadData();

            } catch (error) {

                console.error("新增展會失敗:", error);

                alert(
                    "新增展會失敗！\n\n" +
                    "請確認 Firestore Database 與 Rules 是否設定正確。"
                );
            }
        };


        // =========================================================
        // 進入展會
        // =========================================================

        window.enterExhibition = function(id) {

            currentExId = id;

            currentView = "detail";

            render();
        };


        // =========================================================
        // 切換頁面
        // =========================================================

        window.switchView = function(view) {

            currentView = view;

            render();
        };


        // =========================================================
        // 回首頁
        // =========================================================

        window.goHome = function() {

            currentView = "home";

            currentExId = null;

            loadData();
        };


        // =========================================================
        // 新增廠商
        // =========================================================

        window.addVendor = async function() {

            const name =
                document.getElementById("v-name").value.trim();

            const code =
                document.getElementById("v-code").value.trim();

            const img =
                document.getElementById("v-img").value.trim();

            const url =
                document.getElementById("v-url").value.trim();

            const productName =
                document.getElementById("p-name").value.trim();

            const productPrice =
                document.getElementById("p-price").value.trim();


            if (!name || !code) {

                alert("請至少填寫「廠商名稱」與「攤位代碼」！");

                return;
            }


            const ex =
                exhibitions.find(e => e.id === currentExId);


            if (!ex) {

                alert("找不到目前的展會。");

                return;
            }


            if (!db) {

                alert("Firebase 尚未成功連線。");

                return;
            }


            try {

                const vendors =
                    ex.vendors
                        ? [...ex.vendors]
                        : [];


                // 檢查攤位代碼是否重複

                const duplicate =
                    vendors.some(
                        v =>
                            String(v.code).toUpperCase()
                            === code.toUpperCase()
                    );


                if (duplicate) {

                    alert(
                        "攤位代碼「" +
                        code +
                        "」已經有廠商了！"
                    );

                    return;
                }


                vendors.push({

                    name: name,

                    code: code.toUpperCase(),

                    img: img,

                    url: url,

                    productName: productName,

                    productPrice: productPrice

                });


                // 寫入 Firebase

                await updateDoc(

                    doc(
                        db,
                        "exhibitions",
                        currentExId
                    ),

                    {
                        vendors: vendors
                    }
                );


                // 更新本地資料

                ex.vendors = vendors;


                alert("廠商已成功儲存到雲端！");


                render();


            } catch (error) {

                console.error("新增廠商失敗:", error);

                alert(
                    "廠商儲存失敗！\n\n" +
                    "請確認 Firebase Firestore Rules 是否允許寫入。"
                );
            }
        };


        // =========================================================
        // 刪除廠商
        // =========================================================

        window.deleteVendor = async function(idx) {

            const ex =
                exhibitions.find(e => e.id === currentExId);


            if (!ex || !ex.vendors) {
                return;
            }


            if (
                !confirm(
                    "確定要刪除這個廠商嗎？"
                )
            ) {
                return;
            }


            try {

                const vendors =
                    [...ex.vendors];


                vendors.splice(idx, 1);


                await updateDoc(

                    doc(
                        db,
                        "exhibitions",
                        currentExId
                    ),

                    {
                        vendors: vendors
                    }
                );


                ex.vendors = vendors;


                render();


            } catch (error) {

                console.error("刪除廠商失敗:", error);

                alert("刪除廠商失敗！");
            }
        };


        // =========================================================
        // 刪除展會
        // =========================================================

        window.deleteExhibition = async function(id) {

            if (
                !confirm(
                    "確定要刪除這個展會嗎？\n\n" +
                    "展會裡面的廠商資料也會一起刪除。"
                )
            ) {
                return;
            }


            if (!db) {

                alert("Firebase 尚未成功連線。");

                return;
            }


            try {

                await deleteDoc(
                    doc(db, "exhibitions", id)
                );


                alert("展會已刪除。");


                await loadData();


            } catch (error) {

                console.error("刪除展會失敗:", error);

                alert("刪除失敗，請檢查 Firebase Rules。");
            }
        };


        // =========================================================
        // 地圖：查看攤位
        // =========================================================

        window.openVendorByCode = function(code) {

            const ex =
                exhibitions.find(e => e.id === currentExId);


            if (!ex) {
                return;
            }


            const vendors =
                ex.vendors || [];


            const vendor =
                vendors.find(
                    v =>
                        String(v.code).toUpperCase()
                        === code.toUpperCase()
                );


            const infoBox =
                document.getElementById("map-modal-info");


            const bodyBox =
                document.getElementById("modal-content-body");


            if (!infoBox || !bodyBox) {
                return;
            }


            infoBox.classList.remove("hidden");


            if (vendor) {

                bodyBox.innerHTML = `

                    ${
                        vendor.img

                        ?

                        `
                        <img
                            src="${escapeHTML(vendor.img)}"
                            class="w-24
                                   h-24
                                   object-contain
                                   rounded
                                   border
                                   mb-3"
                            onerror="this.style.display='none'"
                        >
                        `

                        :

                        ""
                    }


                    <p class="mb-1">
                        <strong>店家名稱：</strong>
                        ${escapeHTML(vendor.name)}
                    </p>


                    <p class="mb-1">
                        <strong>攤位代碼：</strong>
                        ${escapeHTML(vendor.code)}
                    </p>


                    <p class="mb-1">
                        <strong>推薦商品：</strong>
                        ${escapeHTML(vendor.productName || "無")}
                    </p>


                    <p class="mb-1">
                        <strong>價格：</strong>
                        ${
                            vendor.productPrice
                                ? "$" + escapeHTML(vendor.productPrice)
                                : "未提供"
                        }
                    </p>


                    ${
                        vendor.url

                        ?

                        `
                        <p class="mt-3">

                            <a
                                href="${escapeHTML(vendor.url)}"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="bg-blue-600
                                       text-white
                                       text-xs
                                       px-3
                                       py-2
                                       rounded
                                       inline-block
                                       hover:bg-blue-700"
                            >
                                前往官方網站 →
                            </a>

                        </p>
                        `

                        :

                        `
                        <p
                            class="text-xs
                                   text-gray-400
                                   mt-3"
                        >
                            此廠商尚未提供網站
                        </p>
                        `
                    }

                `;

            } else {

                bodyBox.innerHTML = `

                    <p class="text-gray-400">

                        代碼
                        <strong>${escapeHTML(code)}</strong>
                        尚無登錄的廠商資料。

                    </p>

                `;
            }
        };


        // =========================================================
        // 啟動程式
        // =========================================================

        loadData();

    </script>

</body>
</html>
